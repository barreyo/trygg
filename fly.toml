# fly.toml app configuration file generated for trygg on 2026-09-01T21:45:17-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trygg'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
dockerfile = 'etc/docker/Dockerfile'

[deploy]
release_command = '/app/bin/migrate'

[env]
PHX_HOST = 'track.backmanwong.family'
PORT = '8080'
POOL_SIZE = '10'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'connections'
hard_limit = 1000
soft_limit = 250

[[http_service.checks]]
grace_period = '30s'
interval = '15s'
timeout = '5s'
method = 'GET'
path = '/health'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
