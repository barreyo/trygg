# fly.toml app configuration file generated for trygg on 2026-09-01T21:45:17-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trygg'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
[deploy]
release_command = '/app/bin/migrate'

[env]
PHX_HOST = 'track.backmanwong.family'
PORT = '8080'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'connections'
hard_limit = 1000
soft_limit = 1000

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
