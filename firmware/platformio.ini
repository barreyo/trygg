; Trygg diaper button — M5Stack Basic (ESP32).
;   make fw-build | fw-flash | fw-monitor   (from the repo root)
[env:m5stack-basic]
platform = espressif32@^6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; The v2.7 kit has 16 MB of flash (the board definition assumes 4). default_16MB.csv has two 6.5 MB
; app slots, which is what lets the device update itself over the air; the M5GFX Unicode fonts
; (å/ä/ö in names) alone don't fit the stock 1.3 MB slot.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
lib_deps =
  m5stack/M5Unified@^0.2.2
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=0
