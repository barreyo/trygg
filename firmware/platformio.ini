; Trygg diaper button — M5Stack Basic (ESP32).
;   make fw-build | fw-flash | fw-monitor   (from the repo root)
[env:m5stack-basic]
platform = espressif32@^6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; M5GFX's built-in Unicode fonts (å/ä/ö in names) don't fit the default 1.3 MB app slot.
board_build.partitions = huge_app.csv
lib_deps =
  m5stack/M5Unified@^0.2.2
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=0
