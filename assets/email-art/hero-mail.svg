<!-- moon -->
<svg x="478" y="14" width="84" height="84" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="url(#moonglow)"/>
  <circle cx="50" cy="50" r="20" fill="#ffe08a" mask="url(#moonmask)"/>
</svg>
<!-- faint clouds -->
<g fill="#fff" opacity="0.1"><ellipse cx="86" cy="150" rx="40" ry="11"/><circle cx="70" cy="142" r="11"/><circle cx="96" cy="138" r="14"/></g>
<g fill="#fff" opacity="0.08"><ellipse cx="522" cy="176" rx="36" ry="10"/><circle cx="508" cy="169" r="10"/><circle cx="532" cy="165" r="13"/></g>
<!-- hero -->
<g transform="translate(205 22) scale(1.25) translate(-88 -28)">

<circle cx="160" cy="106" r="78" fill="url(#herohalo)"/>
<path d="M90,66 Q112,38 142,64" fill="none" stroke="#ffd9a0" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>
<g transform="translate(160 100)">
  <path d="M-42,-14 L0,-42 L42,-14Z" fill="#ffd9a8"/>
  <rect x="-28" y="-38" width="56" height="48" rx="5" fill="#fffdf8"/>
  <g fill="#f59a4a">
    <circle cx="-17.5" cy="-22" r="3.1"/><circle cx="-10.5" cy="-22" r="3.1"/><circle cx="-3.5" cy="-22" r="3.1"/>
