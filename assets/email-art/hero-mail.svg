  <g transform="translate(0 20)"><use href="#heart" fill="#ff7fa3"/></g>
</g>
<use href="#sparkle" x="104" y="44" width="12" height="12" fill="#fff3c4"/>
<use href="#sparkle" x="212" y="70" width="10" height="10" fill="#ffffff"/>
<use href="#sparkle" x="214" y="128" width="8" height="8" fill="#ffe29a"/>
<g transform="translate(160 96)" fill="#ff7fa3">
  <use href="#heart" x="-34" y="-22" opacity="0.95"/><use href="#heart" x="4" y="-34" opacity="0.95"/><use href="#heart" x="38" y="-20" opacity="0.95"/>
</g>
</g>
<!-- hills -->
<path d="M0,214 C100,196 190,208 300,202 C410,196 500,210 600,200 L600,240 L0,240Z" fill="#231b5e"/>
<path d="M0,230 C120,218 220,226 320,222 C430,218 520,226 600,222 L600,240 L0,240Z" fill="#150f3f"/>
