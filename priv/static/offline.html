<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Trygg</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, sans-serif;
        background: Canvas;
        color: CanvasText;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #offline-app { min-height: 100dvh; }
      /* Shown until offline.js swaps in the quick-logger (or if JS is off). */
      noscript, .fallback {
        display: block;
        text-align: center;
        padding: 3rem 2rem;
        max-width: 24rem;
        margin: 0 auto;
        opacity: .75;
      }
    </style>
  </head>
  <body>
    <div id="offline-app">
      <div class="fallback">
        <h1 style="font-size:1.25rem;margin:0 0 .5rem">You're offline</h1>
        <p style="margin:0 0 1.5rem">
          Trygg will pick up where you left off once you're back online.
        </p>
        <button
          type="button"
          onclick="location.reload()"
          style="font:inherit;padding:.75rem 1.5rem;border-radius:999px;border:1px solid color-mix(in srgb, CanvasText 20%, transparent);background:transparent;color:inherit"
        >
          Try again
        </button>
      </div>
    </div>

    <noscript>
      Trygg needs JavaScript to log entries offline.
    </noscript>

    <!-- Literal, undigested path on purpose: offline.html is a static file
         that mix phx.digest does not rewrite, and the service worker precaches
         this bundle at a stable URL. -->
    <script src="/assets/js/offline.js"></script>
  </body>
</html>
