<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Trygg</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: Canvas;
        color: CanvasText;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { text-align: center; padding: 2rem; max-width: 24rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { opacity: .7; margin: 0 0 1.5rem; }
      button {
        font: inherit;
        padding: .75rem 1.5rem;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        background: transparent;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Trygg needs a connection to load and sync your log. It will pick up where you left off once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
